<title>Hero Block with Text</title>
<meta name="description" content="A responsive hero block with text, created with HTML and TailwindCSS.">

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
        html { scroll-behavior: smooth; }
        img { max-width: 100%; height: auto; }
        a { @apply underline underline-offset-4 decoration-2; }
        a:hover { @apply decoration-dotted; }
        a:focus-visible, button:focus-visible { outline: 3px solid currentColor; outline-offset: 5px; }
        footer { @apply px-[5%] md:px-[20%] py-8 bg-slate-950 text-white text-lg leading-relaxed; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

header { @apply relative isolate overflow-hidden min-h-[60vh] md:min-h-[80vh] flex flex-col justify-center px-6 md:px-[12%] lg:px-[20%] py-16 text-center bg-slate-950; }
header h1 { @apply relative z-10 text-4xl md:text-7xl lg:text-8xl text-white font-bold tracking-tight mb-6 leading-tight; }
header h2 { @apply relative z-10 text-2xl md:text-4xl text-white leading-snug; }
header h1 { animation: enter-down 700ms ease-out both; }
header h2 { animation: enter-left 700ms 150ms ease-out both; }
@keyframes enter-down { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: translateY(0); } }
@keyframes enter-left { from { opacity: 0; transform: translateX(-25px); } to { opacity: 1; transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { header h1, header h2 { animation: none; } }
header { @apply bg-linear-to-br from-indigo-950 via-purple-900 to-rose-900; }</style>
