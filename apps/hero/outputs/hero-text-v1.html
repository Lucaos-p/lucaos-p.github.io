<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Hero Block</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @layer utilities {

            .hero {
                @apply flex flex-col justify-center px-6 py-12 transition-colors duration-200 w-full;
            }

            .hero-content {
                @apply max-w-3xl mx-auto w-full;
            }

            .hero h1 {
                @apply text-4xl md:text-5xl font-extrabold tracking-tight mb-4;
            }

            .hero h2 {
                @apply text-xl md:text-2xl font-medium;
            }

            .hero-light {
                @apply bg-slate-50;
            }

            .hero-light h1 {
                @apply text-slate-900;
            }

            .hero-light h2 {
                @apply text-slate-700;
            }

            .hero-dark {
                @apply bg-slate-900;
            }

            .hero-dark h1 {
                @apply text-slate-50;
            }

            .hero-dark h2 {
                @apply text-slate-300;
            }

            .hero-centre {
                @apply text-center items-center;
            }

            .hero-min-height {
                @apply min-h-[480px] md:min-h-[85vh];
            }

        }
    </style>
</head>

<body>

    <header class="hero hero-dark hero-centre hero-min-height">
        <div class="hero-content">
            <h1>Design your next adventure</h1>
            <h2>Create a hero block with your own text and styles.</h2>
        </div>
    </header>

</body>
</html>
