<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block Generator</title>
    <meta name="description" content="Crie e personalize blocos Hero para páginas web.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @layer utilities {
            .hero {
                @apply flex flex-col justify-center px-6 py-12 transition-colors duration-200 w-full;
            }

            .hero-content {
                @apply max-w-3xl mx-auto w-full;
            }

            .hero h1 {
                @apply text-4xl md:text-5xl font-extrabold mb-4 outline-none focus:ring-2 focus:ring-blue-500 rounded px-1;
            }

            .hero h2 {
                @apply text-xl md:text-2xl font-medium outline-none focus:ring-2 focus:ring-blue-500 rounded px-1;
            }

            .hero-light {
                @apply bg-slate-50;
            }

            .hero-light h1 {
                @apply text-slate-900;
            }

            .hero-light h2 {
                @apply text-slate-700;
            }

            .hero-dark {
                @apply bg-slate-900;
            }

            .hero-dark h1 {
                @apply text-slate-50;
            }

            .hero-dark h2 {
                @apply text-slate-300;
            }

            .hero-centre {
                @apply text-center items-center;
            }

            .hero-min-height {
                @apply min-h-[480px] md:min-h-[85vh];
            }

            .hero-h1-serif {
                @apply font-serif;
            }

            .hero-h2-serif {
                @apply font-serif;
            }
        }

        @layer utilities {
            .app-container {
                @apply min-h-screen bg-slate-100 flex flex-col justify-between pb-24;
            }

            .control-panel {
                @apply bg-white border-b border-slate-200 px-4 py-3 shadow-sm sticky top-0 z-10;
            }

            .control-wrapper {
                @apply max-w-6xl mx-auto flex flex-col gap-4 py-2;
            }

            .controls-main-row {
                @apply flex flex-wrap items-center justify-between gap-4;
            }

            .checkbox-group {
                @apply flex flex-wrap items-center gap-6;
            }

            .checkbox-label {
                @apply flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer select-none;
            }

            .checkbox-input {
                @apply w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-2 focus:ring-blue-500 cursor-pointer;
            }

            .effect-controls-grid {
                @apply grid grid-cols-1 md:grid-cols-2 gap-6 pt-3 border-t border-slate-200 text-sm text-slate-700;
            }

            .effect-group {
                @apply flex flex-col gap-2 bg-slate-50 p-3 rounded border border-slate-200;
            }

            .effect-group-title {
                @apply font-bold text-xs text-slate-500 uppercase tracking-wider;
            }

            .range-wrapper {
                @apply flex items-center gap-3;
            }

            .range-input {
                @apply w-full accent-blue-600 cursor-pointer;
            }

            .instruction-banner {
                @apply bg-blue-50 border-y border-blue-100 text-blue-800 text-center py-2 text-sm font-medium;
            }

            .fallback-container {
                @apply max-w-6xl mx-auto w-full px-4 mt-6;
            }

            .fallback-textarea {
                @apply w-full h-32 p-3 font-mono text-xs bg-white border border-slate-300 rounded shadow-inner focus:ring-2 focus:ring-blue-500 outline-none;
            }

            .copy-button {
                @apply fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-3 rounded-full shadow-lg transition-all focus:ring-4 focus:ring-blue-300 cursor-pointer z-50;
            }
        }
    </style>
</head>

<body class="app-container">

    <header class="control-panel">
        <div class="control-wrapper">
            <div class="controls-main-row">
                <span class="font-bold text-slate-800 text-base">
                    Hero Block Generator
                </span>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="darkToggle" class="checkbox-input">
                        Dark appearance
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" id="centreToggle" class="checkbox-input">
                        Centre text
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" id="heightToggle" class="checkbox-input" checked>
                        Minimum height
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" id="subheadingToggle" class="checkbox-input" checked>
                        Show subheading
                    </label>
                </div>
            </div>

            <!-- Typography & Effect Controls -->
            <div class="effect-controls-grid">
                <!-- H1 Effects -->
                <div class="effect-group" id="h1ControlsGroup">
                    <span class="effect-group-title">H1 Text Effects</span>
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <label class="checkbox-label">
                            <input type="checkbox" id="h1SerifToggle" class="checkbox-input">
                            Serif font
                        </label>
                        <div class="range-wrapper flex-grow max-w-xs">
                            <label for="h1SpacingRange" class="text-xs font-medium text-slate-600 whitespace-nowrap">Letter spacing:</label>
                            <input type="range" id="h1SpacingRange" class="range-input" min="-0.05" max="0.10" step="0.005" value="-0.05">
                            <span id="h1SpacingValue" class="text-xs font-mono font-bold w-12 text-right">-0.05em</span>
                        </div>
                    </div>
                </div>

                <!-- H2 Effects -->
                <div class="effect-group" id="h2ControlsGroup">
                    <span class="effect-group-title">H2 Text Effects</span>
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <label class="checkbox-label">
                            <input type="checkbox" id="h2SerifToggle" class="checkbox-input">
                            Serif font
                        </label>
                        <div class="range-wrapper flex-grow max-w-xs">
                            <label for="h2SpacingRange" class="text-xs font-medium text-slate-600 whitespace-nowrap">Letter spacing:</label>
                            <input type="range" id="h2SpacingRange" class="range-input" min="-0.05" max="0.10" step="0.005" value="-0.025">
                            <span id="h2SpacingValue" class="text-xs font-mono font-bold w-12 text-right">-0.025em</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="instruction-banner">
        Click a heading to edit the text.
    </div>

    <main class="flex-grow flex items-center">

        <header id="previewHero" class="hero hero-light hero-min-height">

            <div class="hero-content">

                <h1
                    id="previewH1"
                    contenteditable="true"
                    spellcheck="false"
                    aria-label="Design your next adventure"
                >Lorem ipsum dolor sit amet</h1>

                <h2
                    id="previewH2"
                    contenteditable="true"
                    spellcheck="false"
                    aria-label="Create a hero block with your own text and styles"
                >Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>

            </div>

        </header>

    </main>

    <div id="fallbackArea" class="fallback-container hidden">

        <label for="codeOutput" class="block text-xs font-bold text-slate-600 mb-1">
            Clipboard unavailable. Copy your HTML code manually below:
        </label>

        <textarea
            id="codeOutput"
            class="fallback-textarea"
            readonly
        ></textarea>

    </div>

    <div id="statusMessage" class="sr-only" aria-live="polite"></div>

    <button id="copyBtn" class="copy-button" type="button">
        Copy HTML
    </button>

    <!-- Dedicated Dynamic Letter Spacing Style Element for Preview -->
    <style id="dynamicSpacingStyle">
        #previewH1 { letter-spacing: -0.05em; }
        #previewH2 { letter-spacing: -0.025em; }
    </style>

    <script>
        'use strict';

        const settings = {
            dark: false,
            centre: false,
            height: true,
            subheading: true,
            h1Serif: false,
            h2Serif: false,
            h1Spacing: -0.05,
            h2Spacing: -0.025
        };

        const elements = {
            darkToggle: document.getElementById('darkToggle'),
            centreToggle: document.getElementById('centreToggle'),
            heightToggle: document.getElementById('heightToggle'),
            subheadingToggle: document.getElementById('subheadingToggle'),
            h1SerifToggle: document.getElementById('h1SerifToggle'),
            h2SerifToggle: document.getElementById('h2SerifToggle'),
            h1SpacingRange: document.getElementById('h1SpacingRange'),
            h2SpacingRange: document.getElementById('h2SpacingRange'),
            h1SpacingValue: document.getElementById('h1SpacingValue'),
            h2SpacingValue: document.getElementById('h2SpacingValue'),
            h1ControlsGroup: document.getElementById('h1ControlsGroup'),
            h2ControlsGroup: document.getElementById('h2ControlsGroup'),
            previewHero: document.getElementById('previewHero'),
            previewH1: document.getElementById('previewH1'),
            previewH2: document.getElementById('previewH2'),
            dynamicSpacingStyle: document.getElementById('dynamicSpacingStyle'),
            copyBtn: document.getElementById('copyBtn'),
            fallbackArea: document.getElementById('fallbackArea'),
            codeOutput: document.getElementById('codeOutput'),
            statusMessage: document.getElementById('statusMessage')
        };

        // Prevent rich-text formatting when pasting.
        [elements.previewH1, elements.previewH2].forEach(element => {

            element.addEventListener('paste', event => {

                event.preventDefault();

                const text = event.clipboardData
                    ? event.clipboardData.getData('text/plain')
                    : '';

                document.execCommand('insertText', false, text);

            });

            element.addEventListener('input', updateFallbackTextarea);

        });

        // Escape HTML to prevent injected markup.
        function escapeHTML(str) {

            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }

        // Read checkbox and range values.
        function updateSettingsFromDOM() {

            settings.dark = elements.darkToggle.checked;
            settings.centre = elements.centreToggle.checked;
            settings.height = elements.heightToggle.checked;
            settings.subheading = elements.subheadingToggle.checked;
            settings.h1Serif = elements.h1SerifToggle.checked;
            settings.h2Serif = elements.h2SerifToggle.checked;
            settings.h1Spacing = parseFloat(elements.h1SpacingRange.value);
            settings.h2Spacing = parseFloat(elements.h2SpacingRange.value);

            // Update display values beside sliders
            elements.h1SpacingValue.textContent = settings.h1Spacing.toFixed(3) + 'em';
            elements.h2SpacingValue.textContent = settings.h2Spacing.toFixed(3) + 'em';

            renderPreview();
            updateFallbackTextarea();

        }

        // Update preview.
        function renderPreview() {

            elements.previewHero.classList.toggle('hero-dark', settings.dark);
            elements.previewHero.classList.toggle('hero-light', !settings.dark);

            elements.previewHero.classList.toggle('hero-centre', settings.centre);

            elements.previewHero.classList.toggle('hero-min-height', settings.height);

            elements.previewH1.classList.toggle('hero-h1-serif', settings.h1Serif);
            elements.previewH2.classList.toggle('hero-h2-serif', settings.h2Serif);

            elements.previewH2.hidden = !settings.subheading;

            if (settings.subheading) {
                elements.previewH2.removeAttribute('tabindex');
                elements.h2ControlsGroup.style.opacity = '1';
                elements.h2ControlsGroup.style.pointerEvents = 'auto';
                elements.h2SerifToggle.disabled = false;
                elements.h2SpacingRange.disabled = false;
            } else {
                elements.previewH2.setAttribute('tabindex', '-1');
                elements.h2ControlsGroup.style.opacity = '0.4';
                elements.h2ControlsGroup.style.pointerEvents = 'none';
                elements.h2SerifToggle.disabled = true;
                elements.h2SpacingRange.disabled = true;
            }

            // Update dedicated inline/dynamic spacing style element
            elements.dynamicSpacingStyle.textContent = `
                #previewH1 { letter-spacing: ${settings.h1Spacing}em; }
                #previewH2 { letter-spacing: ${settings.h2Spacing}em; }
            `;

        }

        // Generate standalone HTML.
        function generateExportHTML() {

            const h1Text = escapeHTML(elements.previewH1.textContent);
            const h2Text = escapeHTML(elements.previewH2.textContent);

            let heroClasses = 'hero';

            heroClasses += settings.dark ? ' hero-dark' : ' hero-light';

            if (settings.centre) {
                heroClasses += ' hero-centre';
            }

            if (settings.height) {
                heroClasses += ' hero-min-height';
            }

            if (settings.h1Serif) {
                heroClasses += ' hero-h1-serif';
            }

            const h2ElementCode = settings.subheading
                ? `\n            <h2${settings.h2Serif ? ' class="hero-h2-serif"' : ''}>${h2Text}</h2>`
                : '';

            return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Hero Block</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>

    <style type="text/tailwindcss">
        @layer utilities {

            .hero {
                @apply flex flex-col justify-center px-6 py-12 transition-colors duration-200 w-full;
            }

            .hero-content {
                @apply max-w-3xl mx-auto w-full;
            }

            .hero h1 {
                @apply text-4xl md:text-5xl font-extrabold mb-4;
            }

            .hero h2 {
                @apply text-xl md:text-2xl font-medium;
            }

            .hero-light {
                @apply bg-slate-50;
            }

            .hero-light h1 {
                @apply text-slate-900;
            }

            .hero-light h2 {
                @apply text-slate-700;
            }

            .hero-dark {
                @apply bg-slate-900;
            }

            .hero-dark h1 {
                @apply text-slate-50;
            }

            .hero-dark h2 {
                @apply text-slate-300;
            }

            .hero-centre {
                @apply text-center items-center;
            }

            .hero-min-height {
                @apply min-h-[480px] md:min-h-[85vh];
            }

            .hero-h1-serif {
                @apply font-serif;
            }

            .hero-h2-serif {
                @apply font-serif;
            }

        }
    </style>
    <style>
        .exported-hero h1 { letter-spacing: ${settings.h1Spacing}em; }
        .exported-hero h2 { letter-spacing: ${settings.h2Spacing}em; }
    </style>
</head>

<body>

    <header class="${heroClasses} exported-hero">
        <div class="hero-content">
            <h1>${h1Text}</h1>${h2ElementCode}
        </div>
    </header>

</body>
</html>`;

        }

        // Keep fallback textarea synchronized.
        function updateFallbackTextarea() {

            elements.codeOutput.value = generateExportHTML();

        }

        // Copy generated HTML.
        async function handleCopyAction() {

            const finalHTML = generateExportHTML();

            elements.codeOutput.value = finalHTML;

            try {

                if (!navigator.clipboard || !navigator.clipboard.writeText) {
                    throw new Error('Clipboard API unavailable');
                }

                await navigator.clipboard.writeText(finalHTML);

                elements.fallbackArea.classList.add('hidden');

                elements.statusMessage.textContent =
                    'HTML copied successfully.';

                elements.copyBtn.textContent = 'Copied!';

                setTimeout(() => {
                    elements.copyBtn.textContent = 'Copy HTML';
                }, 2000);

            } catch (error) {

                elements.fallbackArea.classList.remove('hidden');

                elements.codeOutput.focus();
                elements.codeOutput.select();

                elements.statusMessage.textContent =
                    'Copy failed. Please copy the HTML manually.';

            }

        }

        // Control listeners (Checkboxes & Ranges).
        [
            elements.darkToggle,
            elements.centreToggle,
            elements.heightToggle,
            elements.subheadingToggle,
            elements.h1SerifToggle,
            elements.h2SerifToggle,
            elements.h1SpacingRange,
            elements.h2SpacingRange
        ].forEach(control => {

            control.addEventListener('input', updateSettingsFromDOM);
            control.addEventListener('change', updateSettingsFromDOM);

        });

        // Copy button.
        elements.copyBtn.addEventListener('click', handleCopyAction);

        // Initial render.
        updateSettingsFromDOM();

    </script>

</body>
</html>
